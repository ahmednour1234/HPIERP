org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# المشروع على E: والـ pub cache على C: — نعطّل الـ Kotlin incremental cache
# لتجنّب خطأ "different roots" عند بناء الـ plugins (image_picker وغيره).
kotlin.incremental=false
